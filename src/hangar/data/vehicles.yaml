# Hangar's own metadata about vehicles. This file contains no third-party
# content: it only says how to launch a model. A model directory can override
# any of these fields with its own `hangar.yaml`.
#
#   type:      copter | plane | rover | boat   (picks the ArduPilot binary)
#   defaults:  base parameter files, relative to ArduPilot's Tools/autotest
#              (the same files sim_vehicle.py uses, see pysim/vehicleinfo.py)
#   params:    extra parameter files (looked up next to the model and in config/ dirs)
#   skip:      true to hide a model that is not a vehicle on its own
#   camera_pose:   where `camera: true` mounts a camera if the model has none
#                  [x, y, z, roll, pitch, yaw] in m/deg on the body (default: nose, looking ahead)
#   camera_parent: link the camera is fixed to (default: base_link)

# Vehicles that use ArduPilot's built-in physics. They need no Gazebo, so they
# work right after install and are handy for quick tests and CI.
builtin:
  sitl:plane:
    type: plane
    sitl_model: plane
    defaults: [models/plane.parm]
    description: Fixed-wing, built-in physics
  sitl:copter:
    type: copter
    sitl_model: quad
    defaults: [default_params/copter.parm]
    description: Quadcopter, built-in physics
  sitl:quadplane:
    type: plane
    sitl_model: quadplane
    defaults: [default_params/quadplane.parm]
    description: VTOL quadplane, built-in physics
  sitl:rover:
    type: rover
    sitl_model: rover
    defaults: [default_params/rover.parm]
    description: Ground rover, built-in physics
  sitl:boat:
    type: boat
    sitl_model: motorboat
    defaults: [default_params/rover.parm, default_params/motorboat.parm]
    description: Motor boat, built-in physics

# Gazebo models (ArduPilot/ardupilot_gazebo and ArduPilot/SITL_Models).
# A <model>.param file found in a config/ directory is added automatically.
gazebo:
  iris_with_gimbal:       {type: copter, params: [gazebo-iris-gimbal.parm]}
  iris_with_ardupilot:    {type: copter, params: [gazebo-iris.parm]}
  zephyr_with_ardupilot:  {type: plane,  params: [gazebo-zephyr.parm]}
  alti_transition_quad:   {type: plane,  defaults: [default_params/quadplane.parm]}
  bicopter_with_ardupilot: {type: copter}
  hexapod_copter:         {type: copter}
  quadruped:              {type: copter}
  skywalker_x8_quad:      {type: plane,  defaults: [default_params/quadplane.parm]}
  skywalker_x8:           {type: plane, camera_pose: [0.7, 0, 0.05, 0, 0, 0]}
  skycat_tvbs:            {type: plane, camera_pose: [0.5, 0, 0.1, 0, 0, 0]}
  mini_talon_vtail:       {type: plane, camera_pose: [0.4, 0, 0.05, 0, 0, 0]}
  swan_k1_hwing:          {type: plane, camera_pose: [0.6, 0, 0.1, 0, 0, 0]}
  wsc_aircraft:           {type: plane, camera_pose: [0.5, 0, 0.08, 0, 0, 0]}
  firtinam:               {type: plane, camera_pose: [0.49, 0, 0.02, 0, 0, 0]}
  sawppy:                 {type: rover}
  omni3rover:             {type: rover}
  omni4rover:             {type: rover}
  r1_rover:               {type: rover}
  wildthumper:            {type: rover}
  wildthumper_with_lidar: {type: rover}
  daf_xf_450_tractor:     {type: rover}
  lawnmower:              {type: rover}
  blueboat:               {type: boat}
  catamaran:              {type: boat}
  daf_xf_450_flatbed_trailer: {skip: true}   # towed by the tractor, not a vehicle

# Base parameter files per vehicle type, used when a model lists none.
type_defaults:
  copter: [default_params/copter.parm]
  plane: [models/plane.parm]
  rover: [default_params/rover.parm]
  boat: [default_params/rover.parm, default_params/motorboat.parm]
