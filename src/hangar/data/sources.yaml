# Third-party projects Hangar can download for you. Nothing from these
# projects ships with Hangar: they are fetched on your machine, from their
# own repositories, only after you have seen their license and said yes.
# `ref` is a tag, branch or commit; pinning keeps every user on the same code.

ardupilot_sitl:
  title: ArduPilot SITL 4.7.2 (official prebuilt binaries)
  kind: download
  url: https://firmware.ardupilot.org
  ref: "4.7.2"
  dir: ardupilot-sitl
  license: GPL-3.0
  required: true
  purpose: Ready-to-run arducopter / arduplane / ardurover from ArduPilot's build server, plus the
    parameter files they start from. Takes seconds; no compiler needed.
  files:
    # {arch} is SITL_x86_64_linux_gnu or SITL_arm_linux_gnueabihf
    bin/arducopter: https://firmware.ardupilot.org/Copter/stable-4.7.2/{arch}/arducopter
    bin/arduplane: https://firmware.ardupilot.org/Plane/stable-4.7.2/{arch}/arduplane
    bin/ardurover: https://firmware.ardupilot.org/Rover/stable-4.7.2/{arch}/ardurover
    autotest/models/plane.parm: https://raw.githubusercontent.com/ArduPilot/ardupilot/Plane-4.7.2/Tools/autotest/models/plane.parm
    autotest/default_params/copter.parm: https://raw.githubusercontent.com/ArduPilot/ardupilot/Plane-4.7.2/Tools/autotest/default_params/copter.parm
    autotest/default_params/quadplane.parm: https://raw.githubusercontent.com/ArduPilot/ardupilot/Plane-4.7.2/Tools/autotest/default_params/quadplane.parm
    autotest/default_params/rover.parm: https://raw.githubusercontent.com/ArduPilot/ardupilot/Plane-4.7.2/Tools/autotest/default_params/rover.parm
    autotest/default_params/motorboat.parm: https://raw.githubusercontent.com/ArduPilot/ardupilot/Plane-4.7.2/Tools/autotest/default_params/motorboat.parm
    autotest/default_params/gazebo-iris.parm: https://raw.githubusercontent.com/ArduPilot/ardupilot/Plane-4.7.2/Tools/autotest/default_params/gazebo-iris.parm
    autotest/default_params/gazebo-zephyr.parm: https://raw.githubusercontent.com/ArduPilot/ardupilot/Plane-4.7.2/Tools/autotest/default_params/gazebo-zephyr.parm

ardupilot:
  title: ArduPilot source (build SITL yourself)
  url: https://github.com/ArduPilot/ardupilot
  ref: Plane-4.7.2          # stable 4.7.2 tree; builds copter, plane and rover
  license: GPL-3.0
  submodules: true
  required: false
  purpose: Only if you want to modify ArduPilot. Builds the SITL binaries from source (10-30 min).
  build:
    prereqs: Tools/environment_install/install-prereqs-ubuntu.sh -y
    commands:
      # install-prereqs creates ~/venv-ardupilot; waf must run inside it
      - . ~/venv-ardupilot/bin/activate 2>/dev/null || true; ./waf configure --board sitl
      - . ~/venv-ardupilot/bin/activate 2>/dev/null || true; ./waf copter plane rover

ardupilot_gazebo:
  title: ArduPilot Gazebo plugin
  url: https://github.com/ArduPilot/ardupilot_gazebo
  ref: 082a0fe231f6e63bc8d1598f1cba461d9e2ea7f5
  license: LGPL-3.0
  required: false
  purpose: Connects Gazebo vehicles to SITL and streams their cameras. Needed only for Gazebo vehicles.
  build:
    apt: [libgz-sim8-dev, rapidjson-dev, libopencv-dev, libgstreamer1.0-dev,
          libgstreamer-plugins-base1.0-dev, gstreamer1.0-plugins-bad, gstreamer1.0-libav,
          gstreamer1.0-gl, cmake, build-essential]
    commands:
      - GZ_VERSION=harmonic cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - GZ_VERSION=harmonic cmake --build build -j

sitl_models:
  title: ArduPilot SITL_Models (example vehicles and worlds)
  url: https://github.com/ArduPilot/SITL_Models
  ref: 25bc38ed8c6c0345840159a8cbc0b02781d52f3c
  dir: SITL_Models
  license: not specified by the repository (check each model before redistributing it)
  required: false
  purpose: Ready-made Gazebo planes, copters, rovers, boats and worlds.

mavproxy:
  title: MAVProxy (shared map and console)
  kind: python
  url: https://github.com/ArduPilot/MAVProxy
  ref: "1.8.75"
  dir: tools/mavproxy
  license: GPL-3.0
  required: false
  purpose: The map with every vehicle on it, MAVProxy's console and its commands (the Map button,
    and '!command' in Hangar's command line). Installs into its own environment, about 900 MB
    (wxPython, OpenCV); no sudo.
  packages:
    # MAVProxy itself without its dependencies: they would pull VTK (~500 MB, only for the 3D map)
    nodeps: ["MAVProxy==1.8.75"]
    deps: [pymavlink, defusedxml, pyserial, numpy, pynmeagps, opencv-python, matplotlib, Pillow]
    # wxPython has no Linux wheels on PyPI; its project publishes them per Ubuntu release
    wxpython: https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-{ubuntu}/wxPython-4.2.2-{py}-{py}-linux_x86_64.whl

hangar_earth:
  title: hangar-earth (Gazebo worlds from real places)
  kind: python
  url: https://github.com/Enginar140/hangar-earth
  ref: "0.1.0"
  dir: tools/hangar-earth
  license: MIT (the generator); the terrain and imagery it downloads carry their own terms, written to each world's ATTRIBUTION.txt
  required: false
  purpose: Builds a Gazebo world for any place on Earth from Copernicus DEM terrain and Sentinel-2
    imagery ('hangar world create'). Its own environment, about 200 MB (GDAL inside rasterio); no sudo.
  packages:
    deps: ["hangar-earth @ https://github.com/Enginar140/hangar-earth/releases/download/v0.1.0/hangar_earth-0.1.0-py3-none-any.whl"]
