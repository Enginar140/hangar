name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run hangar --version && uv run hangar ports --example fleet || true

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning install.sh
      - run: bash install.sh --from "$PWD" --yes --no-ardupilot --no-gazebo
