[project]
name = "sitl-hangar"
dynamic = ["version"]
description = "Multi-vehicle ArduPilot SITL + Gazebo launcher with a terminal UI, one port plan and zero window clutter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Enginar140" }]
keywords = ["ardupilot", "sitl", "gazebo", "mavlink", "drone", "simulation", "tui"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "textual>=8.0,<9",
    "pymavlink>=2.4.40",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.scripts]
hangar = "hangar.cli:main"

[project.urls]
Homepage = "https://github.com/Enginar140/hangar"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hangar/__init__.py"  # the one place the version lives

[tool.hatch.build.targets.wheel]
packages = ["src/hangar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["B905"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/images", "docs/screenshots", ".github"]
